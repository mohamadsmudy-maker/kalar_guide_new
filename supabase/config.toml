
[functions.send-complaint-notification]
enabled = true
verify_jwt = false
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-complaint-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-complaint-notification/*.html" ]

[functions.send-breaking-news]
enabled = true
# Database Webhook بانگی دەکات بێ JWT ی بەکارهێنەر. فەنکشنەکە بە notified_at
# خۆی دەپارێزێت: هەر هەواڵێک تەنها یەکجار دەنێردرێت.
verify_jwt = false
entrypoint = "./functions/send-breaking-news/index.ts"

[functions.send-neighborhood-alert]
enabled = true
# Database Webhook بانگی دەکات؛ notified_at ناردنی دووبارە ڕێگری دەکات.
verify_jwt = false
entrypoint = "./functions/send-neighborhood-alert/index.ts"
