name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: a floating 'stable' started failing `--fatal-infos` when a
          # newer Flutter deprecated package:flutter/material.dart. Bump this
          # deliberately together with the material_ui migration.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    # Compiles the Android side (Kotlin, resources, manifest merge) so a broken
    # home-screen widget or manifest edit is caught before release builds.
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # google-services.json is private and gitignored; a placeholder with the
      # right package name is enough to compile a debug build.
      - name: Placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1:android:0000000000000000",
                "android_client_info": {"package_name": "com.muhammad.kalar.kalar_guide"}
              },
              "api_key": [{"current_key": "placeholder"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - run: flutter build apk --debug --target-platform android-arm64

  database:
    name: Migrations & RLS tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh
