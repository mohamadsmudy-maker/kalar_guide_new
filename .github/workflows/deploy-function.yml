name: Deploy Supabase function

# بە دەست جێبەجێ دەکرێت: GitHub ← Actions ← Deploy Supabase function ← Run workflow.
# هیچ شتێک خۆکارانە ناگۆڕێت. پێویستی بە دوو Secret هەیە لە
# Settings ← Secrets and variables ← Actions:
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   (ناسنامەی پڕۆژە، لە URL ی داشبۆردەکەدا)
on:
  workflow_dispatch:
    inputs:
      function:
        description: فەنکشنەکە
        required: true
        type: choice
        options:
          - translate-text
          - gemini-proxy
          - places-search
          - places-nearby
          - places-details
          - hash-password
          - register-customer
          - register-vendor
          - send-complaint-notification
          - send-breaking-news
          - send-neighborhood-alert

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FUNCTION: ${{ inputs.function }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF are not set in the repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: supabase functions deploy "$FUNCTION" --project-ref "$SUPABASE_PROJECT_REF"
