name: kalar_guide_new
description: "ڕێبەری کەلار — Official Guide for Kalar City"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ═══ UI & DESIGN ═══
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  photo_view: ^0.15.0
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.1.1

  # ═══ STATE MANAGEMENT ═══
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1

  # ═══ BACKEND & STORAGE ═══
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.3
  flutter_dotenv: ^5.2.1

  # ═══ LOCATION & MAPS ═══
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1

  # ═══ MEDIA & FILES ═══
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  file_picker: ^8.1.4

  # ═══ AUDIO & VOICE ═══
  record: ^6.1.2
  just_audio: ^0.9.42
  permission_handler: ^11.3.1

  # ═══ PDF & PRINTING ═══
  pdf: ^3.11.1
  printing: ^5.13.4

  # ═══ SHARING & LAUNCH ═══
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # ═══ NOTIFICATIONS & FIREBASE ═══
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  flutter_local_notifications: ^18.0.1

  # ═══ NETWORK ═══
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # ═══ UTILITIES ═══
  intl: ^0.20.2
  crypto: ^3.0.6
  bcrypt: ^1.1.3
  package_info_plus: ^8.1.2
  hijri: ^3.0.0
  uuid: ^4.5.1

  # ═══ EXCEL & GEO ═══
  excel: ^4.0.2
  proj4dart: ^2.1.0

  # ═══ LOCAL PACKAGE ═══
  kelar_boundaries:
    path: packages/kelar_boundaries    # ✅ فۆڵدەری پاکێج

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    # NOTE: .env removed from assets — load via --dart-define or from a secure source
    - assets/images/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar.ttf