name: kalar_guide
description: ڕێبەری کەلار - ئەپی فەرمی شاری کەلار
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══════════════════════════════════════════════
  # 🎨 State Management & Storage
  # ═══════════════════════════════════════════════
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # ═══════════════════════════════════════════════
  # 🗄️ Backend
  # ═══════════════════════════════════════════════
  supabase_flutter: ^2.5.6

  # ═══════════════════════════════════════════════
  # 🔔 Firebase
  # ═══════════════════════════════════════════════
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # ═══════════════════════════════════════════════
  # 🔧 Utils
  # ═══════════════════════════════════════════════
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  http: ^1.2.2
  image: ^4.2.0
  path_provider: ^2.1.4
  package_info_plus: ^8.1.2

  # ═══════════════════════════════════════════════
  # 🗺️ Maps & Location
  # ═══════════════════════════════════════════════
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  google_fonts: ^6.2.1

  # ═══════════════════════════════════════════════
  # 📸 Media
  # ═══════════════════════════════════════════════
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # ═══════════════════════════════════════════════
  # 🎤 Audio (Voice Recording + Playback)
  # ═══════════════════════════════════════════════
  record: ^6.1.1
  just_audio: ^0.9.40
  permission_handler: ^11.3.1

  # ═══════════════════════════════════════════════
  # 📄 PDF & Reports
  # ═══════════════════════════════════════════════
  pdf: ^3.11.1
  printing: ^5.13.2

  # ═══════════════════════════════════════════════
  # 📊 Charts
  # ═══════════════════════════════════════════════
  fl_chart: ^0.69.0

  # ═══════════════════════════════════════════════
  # 📊 Others
  # ═══════════════════════════════════════════════
  url_launcher: ^6.2.5
  flutter_compass: ^0.8.0
  hijri: ^3.0.0
  share_plus: ^10.1.0                # ✅ نوێ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar_027.ttf

# ═══════════════════════════════════════════════
# 🎨 Splash Screen Configuration
# ═══════════════════════════════════════════════
flutter_native_splash:
  color: "#1E88E5"
  image: assets/images/kalar.jpeg
  color_dark: "#0F0F14"
  image_dark: assets/images/kalar.jpeg
  android_12:
    color: "#1E88E5"
    image: assets/images/kalar.jpeg
    color_dark: "#0F0F14"
    image_dark: assets/images/kalar.jpeg
  android: true
  ios: true
  web: false
  fullscreen: true

# ═══════════════════════════════════════════════
# 🎨 App Icon Configuration
# ═══════════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kalar.jpeg"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/images/kalar.jpeg"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false