name: kalar_guide_new
description: "ڕێبەری کەلار — Official Guide for Kalar City"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.6.0
  # pubspec.lock پێویستی بە 3.44+ ە
  flutter: ">=3.44.0"

# ═══════════════════════════════════════════════════════════
# 📦 پاکێجەکان
# ═══════════════════════════════════════════════════════════
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🎨 ڕووکار و دیزاین
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  photo_view: ^0.15.0
  smooth_page_indicator: ^1.2.0+3
  qr_flutter: ^4.1.0
  # ❌ لابران (هیچ فایلێک import ی نەکردبوون):
  #    flutter_svg, flutter_staggered_animations, table_calendar

  # 🔄 بەڕێوەبردنی دۆخ
  # ⚠️ هەردووکیان هێشتا بەکاردێن (provider: ٤١ فایل، riverpod: ٧ فایل)
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1

  # 🗄️ باکئێند و هەڵگرتن
  # ✅ بەرزکرایەوە: main.dart پارامەتری publishableKey بەکاردێنێت کە لە ٢.٨ دا نییە
  supabase_flutter: ^2.15.4
  shared_preferences: ^2.3.3

  # 📍 شوێن و نەخشە
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1

  # 🖼️ میدیا و فایلەکان
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  # ❌ لابران (بەکارنەهاتوو): file_picker, image_editor

  # 🎵 دەنگ
  record: ^6.1.2
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  # ❌ لابران: audioplayers (گۆڕدرا بۆ just_audio)، speech_to_text (بەکارنەهاتوو)

  # 📄 PDF و چاپکردن
  pdf: ^3.11.1
  printing: ^5.13.4

  # 📤 هاوبەشکردن و کردنەوە
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # 🔔 ئاگادارکردنەوە و فایەربەیس
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 🌐 تۆڕ
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  # ❌ لابرا: dio (هیچ فایلێک بەکاری نەدەهێنا)

  # 🛠️ ئامرازەکان
  intl: ^0.20.2
  package_info_plus: ^8.1.2
  hijri: ^3.0.0
  uuid: ^4.5.1
  adhan: ^2.0.0+1
  # 🔐 بۆ lib/utils/password_hasher.dart (گواستنەوەی بەکارهێنەرە کۆنەکان)
  bcrypt: ^1.1.3
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  # 6.4+ پێویستی بە Flutter 3.47 هەیە؛ ئەمە ئەپەکە لەسەر 3.44 دەهێڵێتەوە
  google_sign_in_ios: ">=6.0.0 <6.4.0"
  home_widget: ^0.10.0
  # ❌ لابرا: kelar_boundaries — lib ەکەی بەتاڵە و هیچ شوێنێک بەکاری نەدەهێنا

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  # 🛠️ تەنها بۆ سکریپتەکانی فۆڵدەری tool/ (لە ئەپەکەدا بەکارنایەن)
  supabase: ^2.6.0
  excel: ^4.0.2
  proj4dart: ^2.1.0

# ═══════════════════════════════════════════════════════════
# 🚀 ڕێکخستنی فلەتەر
# ═══════════════════════════════════════════════════════════
flutter:
  uses-material-design: true
  generate: true

  assets:
    # ⚠️ هەرگیز .env لەگەڵ ئەپ مەنێرە — نهێنییەکان لە --dart-define
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/audio/
    # فۆنتی PDF ـەکان (بێ ئینتەرنێت کار دەکات)
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/Roboto-Regular.ttf

  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar.ttf
