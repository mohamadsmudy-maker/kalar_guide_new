# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # ✅ زیادکرا: فایلەکانی tool و test ـی ناو lib
    - tool/**
    - lib/services/password_hasher_test.dart
    - lib/utils/password_hasher_test.dart

  # ✅ ڕێکخستنی زمان — بۆ ئەوەی هەموو پشکنینەکان بە دروستی ئەنجام بدرێن
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

  errors:
    # ═══════════════════════════════════════════════════════
    # 🚨 ئەم هەڵانە بە ERROR دابنێ (بەجێبهێڵە)
    # ═══════════════════════════════════════════════════════
    missing_required_param: error
    missing_return: error
    invalid_assignment: error
    # use_build_context_synchronously: error  # ⚠️ ئەگەر دەتەوێت بە تەواوی چاکی بکەیت، ئەمە چالاک بکە

    # ═══════════════════════════════════════════════════════
    # 🟡 ئەم هەڵانە بکە بە WARNING (لە جیاتی INFO)
    # ═══════════════════════════════════════════════════════
    unused_import: warning
    unused_field: warning
    unused_local_variable: warning
    unused_element: warning
    dead_null_aware_expression: warning
    unnecessary_cast: warning
    invalid_null_aware_operator: warning
    unnecessary_non_null_assertion: warning
    unnecessary_null_comparison: warning
    empty_catches: warning

    # ═══════════════════════════════════════════════════════
    # 🟢 ئەم هەڵانە بکە بە INFO (کەمتر گرنگ)
    # ═══════════════════════════════════════════════════════
    deprecated_member_use: info
    deprecated_member_use_from_same_package: info

    # ═══════════════════════════════════════════════════════
    # ⚪ ئەم هەڵانە ناچالاک بکە (بۆ پڕۆژەکەت پێویست نین)
    # ═══════════════════════════════════════════════════════
    avoid_print: ignore
    unnecessary_import: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_string_interpolations: ignore
    curly_braces_in_flow_control_structures: ignore
    prefer_final_fields: ignore
    unintended_html_in_doc_comment: ignore
    unnecessary_to_list_in_spreads: ignore
    depend_on_referenced_packages: ignore

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ═══════════════════════════════════════════════════════
    # ✅ ئەم یاسایانە چالاک بکە (باشتر بۆ کوالیتی)
    # ═══════════════════════════════════════════════════════
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    avoid_web_libraries_in_flutter: true
    # prefer_single_quotes: true

    # ═══════════════════════════════════════════════════════
    # ⚠️ ئەم یاسایانە ناچالاک بکە (ژاوەژاوە)
    # ═══════════════════════════════════════════════════════
    avoid_print: false
    curly_braces_in_flow_control_structures: false
    unnecessary_brace_in_string_interps: false
    unnecessary_string_interpolations: false
    prefer_final_fields: false
    unintended_html_in_doc_comment: false
    unnecessary_to_list_in_spreads: false
    depend_on_referenced_packages: false